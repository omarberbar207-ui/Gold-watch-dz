<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الساعات الفاخرة</title>

  <!-- 1. تصميم الصفحة والتصنيفات (CSS) -->
  <style>
    /* إعدادات العرض العامة */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #ffffff;
      color: #111111;
      direction: rtl;
      padding-bottom: 40px;
    }

    /* قسم تصنيفات الماركات */
    .categories-section {
      width: 100%;
      max-width: 500px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .categories-title {
      font-size: 22px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 15px;
      text-align: right;
    }

    .slider-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    /* حاوية العرض والشريط المتحرك */
    .slider-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px;
      scrollbar-width: none; /* إخفاء شريط التمرير */
    }

    .slider-container::-webkit-scrollbar {
      display: none; /* إخفاء شريط التمرير في متصفحات الجوال */
    }

    /* تصميم بطاقة الماركة */
    .category-card {
      flex: 0 0 82%;
      scroll-snap-align: center;
      position: relative;
      height: 320px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      background-color: #f5f5f5;
    }

    .category-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* محتوى البطاقة السفلي */
    .card-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 15px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .category-label {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .explore-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 85%;
      padding: 12px 0;
      background-color: #000000;
      color: #ffffff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .explore-btn:active {
      transform: scale(0.97);
      background-color: #222222;
    }

    /* أزرار التنقل بالأسهم */
    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      border: none;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .prev-arrow { right: 8px; }
    .next-arrow { left: 8px; }
  </style>
</head>
<body>

  <!-- 2. هيكل قسم تصنيفات الماركات (HTML) -->
  <section class="categories-section">
    <h2 class="categories-title">اكتشف تصنيفات منتجاتنا !</h2>
    
    <div class="slider-wrapper">
      <!-- أزرار التنقل -->
      <button class="slider-arrow prev-arrow" id="prevBtn" aria-label="السابق">&#10094;</button>
      <button class="slider-arrow next-arrow" id="nextBtn" aria-label="التالي">&#10095;</button>

      <!-- قائمة الصور بطاقات الماركات -->
      <div class="slider-container" id="sliderContainer">
        
        <!-- ROLEX -->
        <div class="category-card">
          <img src="rolex.jpg" alt="ROLEX" class="category-img">
          <div class="card-content">
            <h3 class="category-label">ROLEX</h3>
            <a href="#rolex" class="explore-btn">الإطلاع &larr;</a>
          </div>
        </div>

        <!-- FESTINA -->
        <div class="category-card">
          <img src="festina.jpg" alt="FESTINA" class="category-img">
          <div class="card-content">
            <h3 class="category-label">FESTINA</h3>
            <a href="#festina" class="explore-btn">الإطلاع &larr;</a>
          </div>
        </div>

        <!-- HUBLOT -->
        <div class="category-card">
          <img src="hublot.jpg" alt="HUBLOT" class="category-img">
          <div class="card-content">
            <h3 class="category-label">HUBLOT</h3>
            <a href="#hublot" class="explore-btn">الإطلاع &larr;</a>
          </div>
        </div>

        <!-- CASIO -->
        <div class="category-card">
          <img src="casio.jpg" alt="CASIO" class="category-img">
          <div class="card-content">
            <h3 class="category-label">CASIO</h3>
            <a href="#casio" class="explore-btn">الإطلاع &larr;</a>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- 3. كود التحريك التلقائي كل 3 ثواني (JavaScript) -->
  <script>
    const container = document.getElementById('sliderContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    let autoSlideInterval;
    const slideDuration = 3000; // وقت التحريك التلقائي: كل 3 ثوانٍ

    function slideNext() {
      const card = container.querySelector('.category-card');
      if (!card) return;
      const cardWidth = card.offsetWidth + 15;
      
      // عند الوصول للبطاقة الأخيرة يعود للبداية تلقائياً
      if (Math.abs(container.scrollLeft) + container.clientWidth >= container.scrollWidth - 10) {
        container.scrollTo({ left: 0, behavior: 'smooth' });
      } else {
        container.scrollBy({ left: -cardWidth, behavior: 'smooth' });
      }
    }

    function slidePrev() {
      const card = container.querySelector('.category-card');
      if (!card) return;
      const cardWidth = card.offsetWidth + 15;
      container.scrollBy({ left: cardWidth, behavior: 'smooth' });
    }

    function startAutoSlide() {
      stopAutoSlide();
      autoSlideInterval = setInterval(slideNext, slideDuration);
    }

    function stopAutoSlide() {
      if (autoSlideInterval) clearInterval(autoSlideInterval);
    }

    // ربط الأزرار بالتحريك
    nextBtn.addEventListener('click', () => {
      slideNext();
      startAutoSlide();
    });

    prevBtn.addEventListener('click', () => {
      slidePrev();
      startAutoSlide();
    });

    // إيقاف التمرير التلقائي عند اللمس بيدك وإعادته عند الانتهاء
    container.addEventListener('touchstart', stopAutoSlide, { passive: true });
    container.addEventListener('touchend', startAutoSlide, { passive: true });
    container.addEventListener('mouseenter', stopAutoSlide);
    container.addEventListener('mouseleave', startAutoSlide);

    // تشغيل السلايدر عند فتح الصفحة
    startAutoSlide();
  </script>

</body>
</html>
